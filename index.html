<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI per Fare Soldi — corso interattivo su Claude, Lovable, Higgsfield, agenti AI e monetizzazione." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Avoid theme flash: apply saved/OS preference before paint.
      (function () {
        try {
          var saved = localStorage.getItem('corso:theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <title>AI per Fare Soldi — Corso Interattivo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
